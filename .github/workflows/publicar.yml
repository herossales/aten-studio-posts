name: Carrossel diario

# Sem `schedule` de proposito. O cron do Actions nunca entregou UMA execucao
# neste repo: tres janelas agendadas, zero runs com event=schedule, com a
# configuracao toda correta (repo publico, nao-fork, main como default,
# workflow active) e o workflow_dispatch do mesmo arquivo funcionando sempre.
#
# Quem dispara agora e um agendador externo (cron-job.org) chamando este
# workflow_dispatch as 09:32, 14:17 e 20:34 UTC — 06:32, 11:17 e 17:34 BRT.
# Se o `schedule` fosse mantido "por garantia" e o GitHub voltasse a honra-lo,
# os dois gatilhos somariam e sairiam seis posts por dia.
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar no Instagram (senao, so gera e guarda)'
        type: boolean
        default: false

# Uma execucao por vez, e nunca junto com a coleta: as duas escrevem
# o fila.json.
concurrency:
  group: fila
  cancel-in-progress: false

permissions:
  contents: write # commitar as laminas
  issues: write   # lembrete de musica e alerta de fila baixa

jobs:
  carrossel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Gerar e publicar
        id: post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # GITHUB_TOKEN e GITHUB_REPOSITORY sao automaticos
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.publicar }}" = "true" ]; then
            node src/run.js --publish
          else
            node src/run.js
          fi

      - name: Lembrar de colocar a musica
        if: ${{ success() && steps.post.outputs.permalink }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create musica --color 1D76DB --description "Post no ar aguardando trilha" --force
          gh issue create \
            --title "Adicionar musica: ${{ steps.post.outputs.etiqueta }}" \
            --label musica \
            --body "@herossales

          Novo post do @atenstudio.ai no ar. **Falta adicionar a musica** para entregar no organico.

          ${{ steps.post.outputs.permalink }}

          A API do Instagram nao anexa audio a carrossel (so a Reels), entao este passo e manual: abra o post no **app do celular** e use *Editar > Adicionar musica*. Pelo navegador nao aparece.

          Feche esta issue quando a trilha estiver no ar."

      - name: Avisar se a fila estiver acabando
        if: ${{ success() && steps.post.outputs.restam && fromJSON(steps.post.outputs.restam) < 9 }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh issue list --label fila-baixa --state open --json number --jq '.[].number')" ]; then
            echo "Ja existe issue aberta de fila baixa."; exit 0
          fi
          gh label create fila-baixa --color D93F0B --description "Fila de referencias acabando" --force
          gh issue create \
            --title "Fila de referencias acabando: ${{ steps.post.outputs.restam }} restantes" \
            --label fila-baixa \
            --body "@herossales

          Restam **${{ steps.post.outputs.restam }} conceitos** na fila — menos de 3 dias a 3 posts/dia.

          Salve novas referencias no board do Pinterest. A coleta automatica roda toda segunda, mas da pra disparar na hora em **Actions > Coletar referencias > Run workflow**.

          Quando a fila voltar a encher, feche esta issue."

      - name: Guardar laminas como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrossel-${{ github.run_number }}
          path: out/
          retention-days: 30
